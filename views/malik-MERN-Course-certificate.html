<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Certificates</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f9f9f9;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .certificate-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .certificate {
      border: 1px solid #ccc;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      width: 100%;
      transition: transform 0.2s;
    }
    .certificate:hover {
      transform: scale(1.03);
    }
    .certificate img {
      width: 100%;
      height: auto;
      display: block;
    }
    .caption {
      padding: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

<h1>My Certificates</h1>

<div class="certificate-gallery">
  <div class="certificate">
        <img src="Malik-jalihal-MERN-course.png" alt="Certificate 1">
    <div class="caption">MERN FULL STACK</div>
  </div>
</div>

</body>
</html>
